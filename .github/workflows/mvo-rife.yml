name: mvo-rife

# Extension d'interpolation de Muxiveo (moteur muxiveo-rife, Vulkan/ncnn) : builds Linux (manylinux_2_28),
# Windows et macOS, tests fonctionnels (Vulkan lavapipe sous Linux), release `mvo-rife-vX.Y.Z` (jamais
# « latest ») sur tag, puis flux `mvo-rife.json` de la release `extensions-feed` lu par Muxiveo.

on:
  push:
    branches: ["**"]
    paths:
      - "mvo-rife/**"
      - "scripts/update_feed.py"
      - ".github/workflows/mvo-rife.yml"
    tags:
      - "mvo-rife-v*"
  pull_request:
    paths:
      - "mvo-rife/**"
      - "scripts/update_feed.py"
      - ".github/workflows/mvo-rife.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mvo-rife-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: muxiveo-rife
          - os: windows-2022
            platform: windows-x86_64
            exe: muxiveo-rife.exe
          - os: macos-14
            platform: macos-arm64
            exe: muxiveo-rife
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^project(muxiveo-rife VERSION \([0-9.]*\).*/\1/p' mvo-rife/CMakeLists.txt)
          if [[ "${GITHUB_REF_TYPE}" = "tag" && "${GITHUB_REF_NAME}" != "mvo-rife-v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} différent de la version du CMakeLists (${VERSION})"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 ffmpeg

      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja molten-vk ffmpeg

      - name: Build
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S mvo-rife -B build -G "Visual Studio 17 2022" -A x64
          else
            cmake -S mvo-rife -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          fi
          cmake --build build --config Release --parallel

      # manylinux_2_28 (AlmaLinux 8) : binaire exécutable dès glibc 2.28 (Debian 11, Ubuntu 20.04, RHEL 8…).
      - name: Build (Linux, manylinux_2_28)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src quay.io/pypa/manylinux_2_28_x86_64 bash -euo pipefail -c '
            cmake -S mvo-rife -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel "$(nproc)"'
          sudo chown -R "$(id -u):$(id -g)" build
          MAX=$(objdump -T build/muxiveo-rife | grep -oE 'GLIBC_[0-9.]+' | sort -V -u | tail -1)
          echo "glibc requise : ${MAX}"
          if [ "$(printf '%s\n' "$MAX" GLIBC_2.28 | sort -V | tail -1)" != "GLIBC_2.28" ]; then
            echo "::error::${MAX} > GLIBC_2.28"
            exit 1
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(find build -maxdepth 2 -type f -name "${{ matrix.exe }}" | head -1)
          EXTRA=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            MVK="$(brew --prefix molten-vk)"
            LIC="$RUNNER_TEMP/MoltenVK-LICENSE.txt"
            cp "$MVK/LICENSE" "$LIC" 2>/dev/null \
              || curl -fsSL https://raw.githubusercontent.com/KhronosGroup/MoltenVK/main/LICENSE -o "$LIC"
            EXTRA=(--moltenvk "$MVK/lib/libMoltenVK.dylib" "$LIC")
          fi
          python mvo-rife/scripts/package.py ${{ matrix.platform }} "$BIN" build/dist "${EXTRA[@]}"
          DIR="build/dist/mvo-rife-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          python -c 'import pathlib,sys; print("bin=" + str(pathlib.Path(sys.argv[1]).resolve()))' \
            "$DIR/${{ matrix.exe }}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        shell: bash
        run: |
          set -uo pipefail
          "${{ steps.package.outputs.bin }}" --version
          "${{ steps.package.outputs.bin }}" --capabilities
          if ! "${{ steps.package.outputs.bin }}" --list-gpus --verbose; then
            # Runners macOS hébergés : pas de GPU Metal exploitable par MoltenVK.
            if [ "$RUNNER_OS" = "macOS" ]; then
              echo "::warning::--list-gpus a échoué (runner sans GPU Metal)"
            else
              exit 1
            fi
          fi

      - name: Tests
        shell: bash
        env:
          MUXIVEO_RIFE_BIN: ${{ steps.package.outputs.bin }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest numpy
          # Sans GPU Vulkan (Windows/macOS hébergés), les tests fonctionnels sont ignorés.
          python -m pytest -q -p no:cacheprovider mvo-rife/tests

      - uses: actions/upload-artifact@v4
        with:
          name: mvo-rife-${{ matrix.platform }}
          path: |
            build/dist/*.tar.gz
            build/dist/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/mvo-rife-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: mvo-rife-*
          merge-multiple: true
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la assets
          (cd assets && sha256sum -- * > SHA256SUMS)
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "mvo-rife ${TAG#mvo-rife-v} — Interpolation d'images pour Muxiveo" \
            --notes-file mvo-rife/README.md \
            --latest=false
      - name: Flux des extensions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view extensions-feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create extensions-feed --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Flux des extensions" --notes "Versions publiées de chaque extension, lues par Muxiveo."
          fi
          mkdir -p feed
          gh release download extensions-feed --repo "$GITHUB_REPOSITORY" -p mvo-rife.json -D feed || true
          python3 scripts/update_feed.py --name mvo-rife --tag "$TAG" --assets assets --feed feed/mvo-rife.json \
            --out feed/mvo-rife.json
          gh release upload extensions-feed feed/mvo-rife.json --repo "$GITHUB_REPOSITORY" --clobber
